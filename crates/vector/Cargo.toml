[package]
name = "meandb-vector"
autobins = false
version = "0.1.0"
edition.workspace = true
description = "Vector search engine for meandb: flat + int8 scalar quantization + rerank, mmap single-file"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/meandb-vector"
readme = "README.md"
keywords = ["vector", "search", "ann", "hnsw", "database"]
categories = ["algorithms", "data-structures", "database"]
rust-version.workspace = true

[lib]
# `meandb_vector` is the internal vector layer used by the umbrella facade.
name = "meandb_vector"
path = "src/lib.rs"

[dependencies]
memmap2 = "0.9"
rayon = { version = "1", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[[bin]]
name = "meandb-vector"
path = "src/bin/meandb-vector.rs"

[[bin]]
name = "vecdb"
path = "src/bin/vecdb.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"
